<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>测试 saveAnalysis API</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .container {
        max-width: 1000px;
        margin: 0 auto;
      }
      .test-section {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      button {
        padding: 10px 15px;
        margin: 5px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      .result {
        margin-top: 10px;
        padding: 10px;
        background: #f8f9fa;
        border-radius: 3px;
        white-space: pre-wrap;
        max-height: 400px;
        overflow-y: auto;
      }
      .error {
        background: #f8d7da;
        color: #721c24;
      }
      .success {
        background: #d4edda;
        color: #155724;
      }
      textarea {
        width: 100%;
        height: 200px;
        margin: 10px 0;
        font-family: monospace;
      }
      input {
        width: 100%;
        padding: 5px;
        margin: 5px 0;
      }
      .json-input {
        font-family: monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>测试 saveAnalysis API</h1>

      <div class="test-section">
        <h3>1. 测试保存分析结果</h3>
        <p>这将使用示例数据测试 <code>POST /api/saveAnalysis</code> 端点</p>
        <button onclick="testSaveAnalysis()">发送测试数据</button>
        <div id="saveResult" class="result"></div>
      </div>

      <div class="test-section">
        <h3>2. 自定义测试数据</h3>
        <p>你可以修改下面的 JSON 数据来测试不同的情况：</p>
        <textarea
          id="customData"
          class="json-input"
          placeholder="输入自定义的 JSON 数据..."
        ></textarea>
        <button onclick="testCustomData()">发送自定义数据</button>
        <div id="customResult" class="result"></div>
      </div>

      <div class="test-section">
        <h3>3. 测试重复哈希（更新功能）</h3>
        <p>使用相同的哈希值再次发送数据，测试更新功能：</p>
        <button onclick="testDuplicateHash()">测试重复哈希</button>
        <div id="duplicateResult" class="result"></div>
      </div>

      <div class="test-section">
        <h3>4. 测试错误情况</h3>
        <button onclick="testMissingFields()">测试缺少必需字段</button>
        <button onclick="testInvalidData()">测试无效数据</button>
        <div id="errorResult" class="result"></div>
      </div>
    </div>

    <script>
      // 生成示例测试数据
      function generateTestData() {
        const now = new Date().toISOString();
        const hash = "test_hash_" + Date.now();

        return {
          sgf: {
            hash: hash,
            filename: "test-game.sgf",
            content:
              "(;FF[4]CA[UTF-8]AP[CGoban:3]ST[2]RU[Japanese]SZ[19]KM[6.50]TM[1800]PW[White]PB[Black];B[pd];W[dd];B[pq];W[dp];B[fq];W[cn];B[jp];W[qf];B[nc];W[rd];B[qc];W[qi])",
            uploadTime: now,
            gameInfo: {
              black: "测试黑棋",
              white: "测试白棋",
              result: "B+R",
              date: "2024-01-15",
              event: "测试对局",
              komi: 6.5,
            },
          },
          analysisConfig: {
            engine: "katago",
            engineVersion: "1.11.0",
            visits: 800,
            time: 30,
            analysisDate: now,
            totalMoves: 12,
          },
          analysisResults: [
            {
              moveNumber: 1,
              move: {
                row: 15,
                col: 15,
                color: "black",
              },
              analysis: {
                recommendedMove: "Q4",
                winRate: "50.2",
                score: "+0.1",
                visits: 800,
                time: 2.5,
                policy: [
                  {
                    move: "Q4",
                    probability: 0.15,
                  },
                  {
                    move: "D4",
                    probability: 0.14,
                  },
                ],
                variations: [
                  {
                    moves: ["Q4", "D4", "Q16"],
                    winRate: "50.5",
                    score: "+0.2",
                    visits: 400,
                  },
                ],
                rawData: {
                  id: "test",
                  turnNumber: 1,
                  moveInfos: [],
                },
              },
            },
            {
              moveNumber: 2,
              move: {
                row: 3,
                col: 3,
                color: "white",
              },
              analysis: {
                recommendedMove: "D16",
                winRate: "49.8",
                score: "-0.1",
                visits: 800,
                time: 2.3,
                policy: [
                  {
                    move: "D16",
                    probability: 0.16,
                  },
                ],
                variations: [
                  {
                    moves: ["D16", "Q16"],
                    winRate: "49.9",
                    score: "0.0",
                    visits: 400,
                  },
                ],
                rawData: {
                  id: "test",
                  turnNumber: 2,
                  moveInfos: [],
                },
              },
            },
          ],
          metadata: {
            createdAt: now,
            updatedAt: now,
            analysisStatus: "completed",
            totalAnalysisTime: 60,
            averageTime: "2.4",
            version: "1.0",
          },
        };
      }

      async function testSaveAnalysis() {
        const resultDiv = document.getElementById("saveResult");
        const testData = generateTestData();

        // 显示发送的数据
        document.getElementById("customData").value = JSON.stringify(
          testData,
          null,
          2
        );

        try {
          const response = await fetch("/api/saveAnalysis", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(testData),
          });

          const result = await response.json();
          resultDiv.className =
            "result " + (result.success ? "success" : "error");
          resultDiv.textContent =
            `状态码: ${response.status}\n\n` + JSON.stringify(result, null, 2);

          // 保存 analysisId 用于后续测试
          if (result.success && result.analysisId) {
            window.lastAnalysisId = result.analysisId;
          }
        } catch (error) {
          resultDiv.className = "result error";
          resultDiv.textContent = "请求失败: " + error.message;
        }
      }

      async function testCustomData() {
        const customData = document.getElementById("customData").value;
        const resultDiv = document.getElementById("customResult");

        if (!customData.trim()) {
          resultDiv.className = "result error";
          resultDiv.textContent = "请输入 JSON 数据";
          return;
        }

        try {
          const data = JSON.parse(customData);

          const response = await fetch("/api/saveAnalysis", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          const result = await response.json();
          resultDiv.className =
            "result " + (result.success ? "success" : "error");
          resultDiv.textContent =
            `状态码: ${response.status}\n\n` + JSON.stringify(result, null, 2);
        } catch (error) {
          resultDiv.className = "result error";
          resultDiv.textContent = "JSON 解析失败或请求失败: " + error.message;
        }
      }

      async function testDuplicateHash() {
        const resultDiv = document.getElementById("duplicateResult");
        const testData = generateTestData();

        // 使用固定的哈希值
        testData.sgf.hash = "duplicate_test_hash";
        testData.sgf.filename = "updated-game.sgf";
        testData.metadata.analysisStatus = "completed";

        try {
          const response = await fetch("/api/saveAnalysis", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(testData),
          });

          const result = await response.json();
          resultDiv.className =
            "result " + (result.success ? "success" : "error");
          resultDiv.textContent =
            `状态码: ${response.status}\n\n` + JSON.stringify(result, null, 2);
        } catch (error) {
          resultDiv.className = "result error";
          resultDiv.textContent = "请求失败: " + error.message;
        }
      }

      async function testMissingFields() {
        const resultDiv = document.getElementById("errorResult");

        // 缺少必需字段的数据
        const invalidData = {
          sgf: {
            filename: "test.sgf",
            // 缺少 hash 和 content
          },
          analysisConfig: {
            engine: "katago",
            // 缺少 engineVersion 和 totalMoves
          },
          // 缺少 analysisResults 和 metadata
        };

        try {
          const response = await fetch("/api/saveAnalysis", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(invalidData),
          });

          const result = await response.json();
          resultDiv.className = "result error";
          resultDiv.textContent =
            `状态码: ${response.status}\n\n` + JSON.stringify(result, null, 2);
        } catch (error) {
          resultDiv.className = "result error";
          resultDiv.textContent = "请求失败: " + error.message;
        }
      }

      async function testInvalidData() {
        const resultDiv = document.getElementById("errorResult");

        // 数据类型错误的数据
        const invalidData = {
          sgf: {
            hash: "test_hash",
            filename: "test.sgf",
            content: "(;FF[4]...)",
            uploadTime: "2024-01-15T10:00:00Z",
            gameInfo: {
              black: "测试黑棋",
              white: "测试白棋",
              komi: "invalid_number", // 应该是数字
            },
          },
          analysisConfig: {
            engine: "katago",
            engineVersion: "1.0",
            totalMoves: "invalid_number", // 应该是数字
          },
          analysisResults: [
            {
              moveNumber: "invalid_number", // 应该是数字
              move: {
                row: "invalid", // 应该是数字
                col: 15,
                color: "invalid_color", // 应该是 black 或 white
              },
            },
          ],
          metadata: {
            createdAt: "2024-01-15T10:00:00Z",
            updatedAt: "2024-01-15T10:00:00Z",
            analysisStatus: "completed",
          },
        };

        try {
          const response = await fetch("/api/saveAnalysis", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(invalidData),
          });

          const result = await response.json();
          resultDiv.className = "result error";
          resultDiv.textContent =
            `状态码: ${response.status}\n\n` + JSON.stringify(result, null, 2);
        } catch (error) {
          resultDiv.className = "result error";
          resultDiv.textContent = "请求失败: " + error.message;
        }
      }

      // 页面加载时初始化示例数据
      window.onload = function () {
        document.getElementById("customData").value = JSON.stringify(
          generateTestData(),
          null,
          2
        );
      };
    </script>
  </body>
</html>
