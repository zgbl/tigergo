<!doctype html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
  <title>SGF Analysis - Mobile</title>
  <!-- Tailwind & Fonts -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- Original CSS (Optional, strictly for board styles if needed, but we try to rely on Tailwind) -->
  <!-- <link rel="stylesheet" href="css/GoBoard4C.css" /> -->
  <style>
    /* Custom styles to match the provided design */
    :root {
      --board-wood: #dcb35c;
      --board-grid: #2a1a0a;
      --sidebar-dark: #0f172a;
      --accent-primary: #6366f1;
    }

    body {
      font-family: "Inter", "Noto Sans SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      min-height: 100dvh;
    }

    .go-board-grid {
      background-image:
        linear-gradient(var(--board-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--board-grid) 1px, transparent 1px);
      background-size: calc(100% / 18) calc(100% / 18);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 10px;
    }

    /* Ensure board container has correct relative positioning for absolute stones */
    #board {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Styles for Stones from GoBoard12.js adaptation */
    .stone {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      z-index: 10;
    }

    .stone.black {
      background: radial-gradient(circle at 30% 30%, #666, #000);
    }

    .stone.white {
      background: radial-gradient(circle at 30% 30%, #fff, #ddd);
      border: 1px solid #ccc;
    }

    /* Hidden elements required by existing JS to prevent errors */
    .legacy-hidden {
      display: none !important;
    }
  </style>
</head>

  <!-- Mobile Integration Script -->
  <script>
    // 🔥 Global Logging Utility
    window.mobileNotify = function (message, type = "info") {
      const logArea = document.getElementById("mobileEngineLog"); // Changed from analysisLog
      if (!logArea) return;

      const p = document.createElement("div"); // Changed from p to div
      const time = new Date().toLocaleTimeString([], {
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });
      p.textContent = `[${time}] ${message}`;
      if (type === "error") p.style.color = "#ef4444";
      if (type === "success") p.style.color = "#10b981";
      if (type === "info") p.style.color = "#6366f1";

      logArea.appendChild(p);
      logArea.scrollTop = logArea.scrollHeight;
    };

    // 🔥 Global Navigation Handler
    window.handleMobileNav = function (actionId) {
      console.log(`[Mobile] Nav triggered: ${actionId}`);
      const btn = document.getElementById(actionId);
      const status = btn
        ? btn.disabled
          ? "Disabled"
          : "Enabled"
        : "Unknown";

      mobileNotify(
        `Click: ${actionId.replace("Btn", "")} (${status})`,
        "success",
      );

      if (btn && btn.disabled) {
        console.log(
          `[Mobile] Button ${actionId} is disabled, ignoring action`,
        );
        return;
      }

      // Execute logic
      if (actionId === "prevBtn" && typeof moveBackward === "function")
        moveBackward();
      if (actionId === "nextBtn" && typeof moveForward === "function")
        moveForward();
      if (actionId === "startBtn" && typeof goToStart === "function")
        goToStart();
      if (actionId === "endBtn" && typeof moveToEnd === "function")
        moveToEnd();
      if (
        actionId === "analyzeFileBtn" &&
        typeof startAnalysis === "function"
      )
        startAnalysis();
      if (
        actionId === "stopAnalysisBtn" &&
        typeof stopAnalysis === "function"
      )
        stopAnalysis();

      // Force UI update
      if (window.sgfAnalyzer && window.sgfAnalyzer.boardController) {
        window.sgfAnalyzer.boardController.updateMoveInfo();
      }
    };

    // Adapter logic to make the existing scripts work with the new UI
    document.addEventListener("DOMContentLoaded", function () {
      console.log("Mobile Analysis - Initializing adapters...");

      // Initialize i18n
      if (window.I18n) {
        window.I18n.init();
      }

      // 1. File Upload Bindings
      const mobileUploadBtn = document.getElementById("mobileUploadBtn");
      const fileInput = document.getElementById("fileInput");
      const fileNameDisplay = document.getElementById("fileNameDisplay");

      if (mobileUploadBtn && fileInput) {
        mobileUploadBtn.addEventListener("click", () => fileInput.click());
      }

      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) {
          const fileName = e.target.files[0].name;
          fileNameDisplay.textContent = fileName;
          // Tag it so I18n doesn't overwrite it
          fileNameDisplay.removeAttribute("data-i18n");

          const msg =
            (window.I18n
              ? window.I18n.t("notify_select_file")
              : "File selected: ") + fileName;
          mobileNotify(msg, "success");

          // Hide the upload prompt once a file is selected
          const prompt = document.getElementById("uploadPrompt");
          if (prompt) prompt.classList.add("hidden");
        }
      });

      // 2. Button State Sync (Observer)
      const observeButtons = [
        "startBtn",
        "prevBtn",
        "nextBtn",
        "endBtn",
        "analyzeFileBtn",
        "stopAnalysisBtn",
      ];
      observeButtons.forEach((id) => {
        const btn = document.getElementById(id);
        if (btn) {
          const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
              if (mutation.attributeName === "disabled") {
                console.log(
                  `[Mobile] ${id} state: ${btn.disabled ? "disabled" : "enabled"}`,
                );
                btn.style.opacity = btn.disabled ? "0.4" : "1";
                btn.style.filter = btn.disabled ? "grayscale(1)" : "none";
                btn.style.pointerEvents = btn.disabled ? "none" : "auto";
              }
            });
          });
          observer.observe(btn, { attributes: true });
          // Sync init state
          btn.style.opacity = btn.disabled ? "0.4" : "1";
          btn.style.filter = btn.disabled ? "grayscale(1)" : "none";
          btn.style.pointerEvents = btn.disabled ? "none" : "auto";
        }
      });

      // 🔥 Analysis Button Toggle Logic
      const analyzeBtn = document.getElementById("analyzeFileBtn");
      const stopBtn = document.getElementById("stopAnalysisBtn");

      if (analyzeBtn && stopBtn) {
        analyzeBtn.addEventListener("click", () => {
          analyzeBtn.classList.add("hidden");
          stopBtn.classList.remove("hidden");
        });
        stopBtn.addEventListener("click", () => {
          stopBtn.classList.add("hidden");
          analyzeBtn.classList.remove("hidden");
        });
      }

      // 4. Global Variables Initialization (CRITICAL for Analysis Engine)
      window.currentMoves = [];
      window.currentMoveIndex = -1;
      window.displayMode = 0;
      window.showingRecentMoves = false;

      // 5. Board Initialization
      // We reuse the createBoard3 logic but need to ensure dimensions are correct
      initializeMobileBoard();
      
      // 🔥 关键修复：窗口大小改变时使用 BoardController 统一刷新，防止棋子消失
      let resizeTimeout;
      window.addEventListener("resize", () => {
        if (resizeTimeout) clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          console.log('🔄 [Mobile] 窗口大小改变，触发 BoardController.refreshBoard()');
          if (window.sgfAnalyzer && window.sgfAnalyzer.boardController) {
            window.sgfAnalyzer.boardController.refreshBoard();
          } else {
            initializeMobileBoard();
          }
        }, 200);
      });
    });

    // 🔥 Expose calculateBoardSize globally for BoardController.js
    window.calculateBoardSize = function () {
      const boardContainer = document.getElementById("boardContainer");
      if (!boardContainer) return { cellSize: 30 }; // Fallback

      // Tailwind aspect-square handles the container size
      const rect = boardContainer.getBoundingClientRect();
      const fullSize = Math.min(rect.width, rect.height);
      const size = fullSize - 4;

      const boardSize = 19;
      let cellSize = size / boardSize;

      return { cellSize };
    };

    // 🔥 Expose updateStoneSizeCSS globally for BoardController.js
    window.updateStoneSizeCSS = function (cellSize) {
      document.documentElement.style.setProperty(
        "--stone-size",
        `${cellSize * 0.95}px`, // 标准化为 0.95
      );
      document.documentElement.style.setProperty(
        "--cell-size",
        `${cellSize}px`,
      );
      document.documentElement.style.setProperty(
        "--font-size",
        `${cellSize * 0.45}px`,
      );
      // Add margin offset variable
      document.documentElement.style.setProperty(
        "--board-margin",
        `${cellSize * 0.4}px`,
      );
    };

    function initializeMobileBoard() {
      const boardContainer = document.getElementById("boardContainer");
      const board = document.getElementById("board");
      if (!boardContainer || !board) return;

      // Use the global calculator
      const { cellSize } = window.calculateBoardSize();

      // Set global CSS variables for stone rendering
      window.updateStoneSizeCSS(cellSize);

      // Global vars expected by GoBoard12
      window.cellSize = cellSize;

      if (typeof createBoard3 === "function") {
        createBoard3({
          domElement: board,
          boardSize: 19,
          cellSize: cellSize,
          lineColor: "#2a1a0a", // Dark grid color from design
          backgroundColor: "transparent", // We use the container background
        });
      }
    }


    // --- Copy of Board Creation Logic from SGFAnalysis.html ---
    function createBoard3(options) {
      let {
        domElement,
        boardSize = 19,
        cellSize,
        lineColor = "#000",
        backgroundColor = "#DEB887",
      } = options;

      domElement.innerHTML = "";
      // Use precise sizing to match the grid
      const marginOffset = cellSize * 0.4;
      const boardPhysicalSize = (boardSize - 1) * cellSize + 2 * marginOffset;

      domElement.style.width = `${boardPhysicalSize}px`;
      domElement.style.height = `${boardPhysicalSize}px`;
      domElement.style.position = "relative";
      if (backgroundColor !== "transparent")
        domElement.style.backgroundColor = backgroundColor;

      // Grid
      for (let i = 0; i < boardSize; i++) {
        // Vertical
        const vertical = document.createElement("div");
        Object.assign(vertical.style, {
          position: "absolute",
          left: `${marginOffset + i * cellSize}px`,
          top: `${marginOffset}px`,
          width: "1px",
          height: `${(boardSize - 1) * cellSize}px`,
          backgroundColor: lineColor,
          zIndex: "1",
        });
        domElement.appendChild(vertical);

        // Horizontal
        const horizontal = document.createElement("div");
        Object.assign(horizontal.style, {
          position: "absolute",
          left: `${marginOffset}px`,
          top: `${marginOffset + i * cellSize}px`,
          width: `${(boardSize - 1) * cellSize}px`,
          height: "1px",
          backgroundColor: lineColor,
          zIndex: "1",
        });
        domElement.appendChild(horizontal);
      }

      // Intersections
      for (let i = 0; i < boardSize; i++) {
        for (let j = 0; j < boardSize; j++) {
          const intersection = document.createElement("div");
          intersection.className = "intersection";
          intersection.dataset.row = i;
          intersection.dataset.col = j;
          Object.assign(intersection.style, {
            position: "absolute",
            left: `${j * cellSize + marginOffset - cellSize / 2}px`,
            top: `${i * cellSize + marginOffset - cellSize / 2}px`,
            width: `${cellSize}px`,
            height: `${cellSize}px`,
            zIndex: "2",
          });
          // intersection.addEventListener('click', (e) => handleClick(e)); // If click needed
          domElement.appendChild(intersection);
        }
      }

      // Star Points
      const starPoints = [
        [3, 3],
        [3, 9],
        [3, 15],
        [9, 3],
        [9, 9],
        [9, 15],
        [15, 3],
        [15, 9],
        [15, 15],
      ];
      starPoints.forEach(([row, col]) => {
        const intersection = domElement.querySelector(
          `[data-row="${row}"][data-col="${col}"]`,
        );
        if (intersection) {
          const starPoint = document.createElement("div");
          Object.assign(starPoint.style, {
            position: "absolute",
            top: "50%",
            left: "50%",
            transform: "translate(-50%, -50%)",
            width: `${cellSize * 0.2}px`,
            height: `${cellSize * 0.2}px`,
            backgroundColor: lineColor,
            borderRadius: "50%",
            zIndex: "3",
          });
          intersection.appendChild(starPoint);
        }
      });

      if (typeof window.addBoardLabels === "function") {
        window.addBoardLabels(domElement, boardSize, cellSize, {
          offset: cellSize * 0.4,
          inset: cellSize * 0.2,
        });
      }
    }
  </script>

  <!-- Audio for stone placement -->
  <audio id="stoneSound" src="Sounds/PlayStone2.mp3" preload="auto"></audio>
</body>

</html>
