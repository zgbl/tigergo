    <script>
      const maxWinSize = 3000;
      const minWinSize = 300;
      const indicator = document.querySelector(".status-indicator");
      function calculateBoardSize() {
        const winWidth = window.innerWidth;
        const winHeight = window.innerHeight;
        //console.log("Post7.html, Line 83, winWidth is:", winWidth);
        //let cellSize = 20;

        // 根据宽度计算 cellSize
        if (winWidth < 480) {
          cellSizeFromWidth = Math.floor((winWidth - 20) / 20); // 为边框留出一些空间
          if (winWidth < minWinSize) {
            cellSizeFromWidth = Math.floor((minWinSize - 20) / 20);
          }
        } else if (winWidth > 768) {
          cellSizeFromWidth = Math.floor(winWidth / 28);
          if (winWidth > maxWinSize) {
            cellSizeFromWidth = Math.floor(maxWinSize / 28);
          }
        } else {
          cellSizeFromWidth = 30; // 默认尺寸
        }

        // 根据高度计算 cellSize
        if (winHeight < 480) {
          cellSizeFromHeight = Math.floor((winHeight - 20) / 20);
          if (winHeight < minWinSize) {
            cellSizeFromHeight = Math.floor((minWinSize - 20) / 20);
          }
        } else if (winHeight > 768) {
          cellSizeFromHeight = Math.floor(winHeight / 25);
          if (winHeight > maxWinSize) {
            cellSizeFromHeight = Math.floor(maxWinSize / 25);
          }
        } else {
          cellSizeFromHeight = 30; // 默认尺寸
        }

        // 取宽度和高度计算结果中的较小值
        let cellSize = Math.min(cellSizeFromWidth, cellSizeFromHeight);

        const boardSize = 19;
        const stoneSize = Math.floor(cellSize * 0.95);

        let maxFrameWidth = cellSize * (boardSize + 3); // 计算棋盘实际宽度 //这个CSS解决了，暂时不用了，先留着。8/5
        //console.log(
        //  "in calculateBoardSize(), maxFrameWidth is:",
        //  maxFrameWidth
        //);
        //console.log(
        //  "cellSize is:",
        //  cellSize,
        //  "boardSize is:",
        //  boardSize,
        //  "stoneSize is:",
        //  stoneSize
        //);

        return { cellSize, stoneSize, maxFrameWidth };
      }

      function updateStoneSizeCSS() {
        function updateStoneSizeCSS() {
          document.documentElement.style.setProperty(
            "--stone-size",
            `${cellSize}px`  // 直接使用cellSize
          );
          document.documentElement.style.setProperty(
            "--cell-size",
            `${cellSize}px`
          );

          document.documentElement.style.setProperty(
            "--font-size",
            `${cellSize * 0.4}px`  // 调整字体大小比例
          );
        }

        function updateSmbdStoneSizeCSS() {  // 修正函数名
          let smallCellSize = cellSize / 1.5;  // 小棋盘的cellSize
          document.documentElement.style.setProperty(
            "--small-stone-size",
            `${smallCellSize}px`  // 直接使用小棋盘的cellSize
          );

          document.documentElement.style.setProperty(
            "--small-font-size",
            `${smallCellSize * 0.3}px`  // 调整小棋盘字体大小
          );
        }
      }

      // window.globalBoardSize = calculateBoardSize(); //好像是没用了，注释掉2024/7/27
      let { cellSize, stoneSize } = calculateBoardSize();
      updateStoneSizeCSS();
      //updateSmbdStoneSizeCSS();  // 修正函数名调用  2025.8.2 造成error, 暂时不用
      //console.log("stoneCSS should be updated.");

        }px`;
        boardElement.style.height = `${
          parseFloat(originalStyle.height) * scaleFactor
        }px`;
        boardElement.style.position = "relative";
        boardElement.style.overflow = "hidden";

        // 创建一个缩放容器
        const scaleContainer = document.createElement("div");
        scaleContainer.style.transform = `scale(${scaleFactor})`;
        scaleContainer.style.transformOrigin = "top left";
        scaleContainer.style.width = `${100 / scaleFactor}%`;
        scaleContainer.style.height = `${100 / scaleFactor}%`;
        boardElement.appendChild(scaleContainer);

        // 使用现有的 createBoard 函数
        createBoard.call({ board: scaleContainer });

        let smallBoardMoveIndex = 0;

        function renderSmallBoard() {
          // 清除所有棋子
          scaleContainer
            .querySelectorAll(".stone")
            .forEach((stone) => stone.remove());

          // 重新渲染棋盘状态
          for (let i = 0; i <= smallBoardMoveIndex; i++) {
            const move = moves[i];
            if (!move.pass) {
              const intersection = scaleContainer.querySelector(
                `[data-row="${move.row}"][data-col="${move.col}"]`
              );
              const stone = document.createElement("div");
              stone.className = `stone ${move.color}`;
              stone.textContent = i + 1; // 显示步数
              intersection.appendChild(stone);
            }
          }
        }

        // 添加控制按钮事件监听器
        const prevButton =
          boardElement.parentNode.querySelector(".small-board-prev");
        const nextButton =
          boardElement.parentNode.querySelector(".small-board-next");

        prevButton.addEventListener("click", () => {
          if (smallBoardMoveIndex > 0) {
            smallBoardMoveIndex--;
            renderSmallBoard();
          }
        });

        nextButton.addEventListener("click", () => {
          if (smallBoardMoveIndex < moves.length - 1) {
            smallBoardMoveIndex++;
            renderSmallBoard();
          }
        });

        renderSmallBoard(); // 初始渲染

        // 准备要发送到后端的数据
        const commentData = {
          //postId: currentPostId, // 确保你有当前帖子的ID
          postId: globalPostId,
          content: comment,
          originalMoves: originalMoves.map((move) => `${move.x},${move.y}`),
          variationMoves: variationMoves.map((move) => `${move.x},${move.y}`),
        };

        // 发送评论数据到后端
        fetch(`${CONFIG.API_BASE_URL}/comments`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(commentData),
        })
          .then((response) => response.json())
          .then((data) => {
            console.log("Comment saved successfully:", data);
            // 可以在这里添加额外的逻辑，比如��新UI等
          })
          .catch((error) => {
            console.error("Error saving comment:", error);
            alert("保存评论时出错，请稍后重试");
          });
      }

      //检查localStorage还有用户信息
      console.log("User in localStorage:", localStorage.getItem("user"));

      function playStoneSound() {
        const audio = document.getElementById("stoneSound");
        audio.volume = 0.2; // 设置音量为50%
        audio.currentTime = 0; // 重置音频到开始
        audio.play();
      }

      //const indicator = document.querySelector('.status-indicator');  //const放在开始了

      function toggleIndicator2() {
        indicator.classList.toggle("active");
        console.log(
          `Indicator is now ${
            indicator.classList.contains("active") ? "active" : "inactive"
          }`
        );
        console.log("Current classes:", indicator.className);
      }

      function createBoard3(options) {
        let {
            domElement,
            boardSize = 19,
            cellSize,
            lineColor = '#000',
            backgroundColor = '#DEB887'
        } = options;

        domElement.innerHTML = '';
        console.log('Creating board on element', domElement);
        domElement.style.width = `${boardSize * cellSize}px`;
        domElement.style.height = `${boardSize * cellSize}px`;
        domElement.style.position = 'relative';
        domElement.style.backgroundColor = backgroundColor;

        // 绘制棋盘线
        for (let i = 0; i < boardSize; i++) {
            // 垂直线
            const vertical = document.createElement('div');
            vertical.style.position = 'absolute';
            vertical.style.left = `${cellSize/2 + i * cellSize}px`;
            vertical.style.top = `${cellSize/2}px`;
            vertical.style.width = '1px';
            vertical.style.height = `${(boardSize - 1) * cellSize}px`;
            vertical.style.backgroundColor = lineColor;
            vertical.style.zIndex = '1';
            domElement.appendChild(vertical);

            // 水平线
            const horizontal = document.createElement('div');
            horizontal.style.position = 'absolute';
            horizontal.style.left = `${cellSize/2}px`;
            horizontal.style.top = `${cellSize/2 + i * cellSize}px`;
            horizontal.style.width = `${(boardSize - 1) * cellSize}px`;
            horizontal.style.height = '1px';
            horizontal.style.backgroundColor = lineColor;
            horizontal.style.zIndex = '1';
            domElement.appendChild(horizontal);
        }

        // 创建交叉点
        for (let i = 0; i < boardSize; i++) {
            for (let j = 0; j < boardSize; j++) {
                const intersection = document.createElement('div');
                intersection.className = 'intersection';
                intersection.dataset.row = i;
                intersection.dataset.col = j;
                intersection.style.position = 'absolute';
                intersection.style.left = `${j * cellSize}px`;
                intersection.style.top = `${i * cellSize}px`;
                intersection.style.width = `${cellSize}px`;
                intersection.style.height = `${cellSize}px`;
                intersection.style.zIndex = '2';
                intersection.addEventListener('click', (e) => handleClick(e));

                domElement.appendChild(intersection);
            }
        }

        // 添加星位
        const starPoints = [
            [3, 3], [3, 9], [3, 15],
            [9, 3], [9, 9], [9, 15],
            [15, 3], [15, 9], [15, 15]
        ];

        starPoints.forEach(([row, col]) => {
            const intersection = domElement.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            if (intersection) {
                const starPoint = document.createElement('div');
                starPoint.style.position = 'absolute';
                starPoint.style.top = '50%';
                starPoint.style.left = '50%';
                starPoint.style.transform = 'translate(-50%, -50%)';
                starPoint.style.width = `${cellSize * 0.2}px`;
                starPoint.style.height = `${cellSize * 0.2}px`;
                starPoint.style.backgroundColor = lineColor;
                starPoint.style.borderRadius = '50%';
                starPoint.style.zIndex = '3';
                intersection.appendChild(starPoint);
            }
        });

        console.log('Board creation completed');
      }

function handleClick(event) {
  try {
    const row = parseInt(event.target.dataset.row, 10);
    const col = parseInt(event.target.dataset.col, 10);

    // 检查是否点击了有效的交叉点
    if (isNaN(row) || isNaN(col)) {
      console.log("Invalid intersection clicked");
      return;
    }

    console.log("handleClick called, isStudyMode:", isStudyMode); 
    console.log(`Clicked on intersection: (${row}, ${col})`);
    
    // 🔥 添加研究模式处理
    if (isStudyMode) {
      handleStudyClick(row, col);
      return;
    }
    
    // 非研究模式下不响应点击（如你所说，查看模式不需要下棋功能）
    
  } catch (error) {
    console.error("Error in handleClick:", error.message);
  }
}
