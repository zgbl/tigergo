<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组织团体对抗赛 (6 vs 6)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/Styles5.css">
    <style>
        .pairing-row {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .vs-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #6c757d;
        }

        .team-title {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div id="navbar-placeholder"></div>
    <div class="container my-5">
        <h2 class="mb-4">组织团体对抗赛 (6 vs 6)</h2>

        <form id="teamMatchForm">
            <div class="row mb-4">
                <div class="col-md-6">
                    <label for="matchName" class="form-label">比赛名称</label>
                    <input type="text" class="form-control" id="matchName" name="name" placeholder="例如：2024春季团体对抗赛"
                        required>
                </div>
                <div class="col-md-6">
                    <label for="matchDate" class="form-label">比赛日期</label>
                    <input type="date" class="form-control" id="matchDate" name="date" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-5">
                    <div class="team-title">
                        <input type="text" class="form-control mb-2" id="teamAName" name="teamAName"
                            placeholder="队伍 A 名称" required>
                        <h5>队伍 A 选手</h5>
                    </div>
                    <div id="teamAPlayers">
                        <!-- 6 Players for Team A -->
                        <div class="mb-2"><input type="text" class="form-control" name="teamAPlayer0"
                                placeholder="第1台选手" required></div>
                        <div class="mb-2"><input type="text" class="form-control" name="teamAPlayer1"
                                placeholder="第2台选手" required></div>
                        <div class="mb-2"><input type="text" class="form-control" name="teamAPlayer2"
                                placeholder="第3台选手" required></div>
                        <div class="mb-2"><input type="text" class="form-control" name="teamAPlayer3"
                                placeholder="第4台选手" required></div>
                        <div class="mb-2"><input type="text" class="form-control" name="teamAPlayer4"
                                placeholder="第5台选手" required></div>
                        <div class="mb-2"><input type="text" class="form-control" name="teamAPlayer5"
                                placeholder="第6台选手" required></div>
                    </div>
                </div>

                <div class="col-md-2 vs-label">
                    <div>VS</div>
                </div>

                <div class="col-md-5">
                    <div class="team-title">
                        <input type="text" class="form-control mb-2" id="teamBName" name="teamBName"
                            placeholder="队伍 B 名称" required>
                        <h5>队伍 B 选手</h5>
                    </div>
                    <div id="teamBPlayers">
                        <!-- 6 Players for Team B -->
                        <div class="mb-2"><input type="text" class="form-control" name="teamBPlayer0"
                                placeholder="第1台选手" required></div>
                        <div class="mb-2"><input type="text" class="form-control" name="teamBPlayer1"
                                placeholder="第2台选手" required></div>
                        <div class="mb-2"><input type="text" class="form-control" name="teamBPlayer2"
                                placeholder="第3台选手" required></div>
                        <div class="mb-2"><input type="text" class="form-control" name="teamBPlayer3"
                                placeholder="第4台选手" required></div>
                        <div class="mb-2"><input type="text" class="form-control" name="teamBPlayer4"
                                placeholder="第5台选手" required></div>
                        <div class="mb-2"><input type="text" class="form-control" name="teamBPlayer5"
                                placeholder="第6台选手" required></div>
                    </div>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary w-100 py-2">创建团体对抗赛</button>
            </div>
        </form>

        <div id="existingMatches" class="mt-5">
            <h3>已创建的团体对抗赛</h3>
            <div id="matchList" class="list-group">
                <!-- Data will be loaded here -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/config.js"></script>
    <script>
        loadNavbar();

        function loadTeamMatches() {
            fetch(`${CONFIG.API_VERCEL_NEXTJS_BASE_URL}/api/team-match/list`)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('matchList');
                    list.innerHTML = '';
                    if (data.teamMatches && data.teamMatches.length > 0) {
                        data.teamMatches.forEach(m => {
                            const item = document.createElement('a');
                            item.href = `Tournaments/manageTeamMatch.html?id=${m._id}`;
                            item.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
                            const date = new Date(m.date).toLocaleDateString();
                            item.innerHTML = `
                                <div>
                                    <strong>${m.name}</strong> <span class="text-muted ms-2">${date}</span>
                                    <div class="small text-secondary">${m.teamA.name} VS ${m.teamB.name}</div>
                                </div>
                                <span class="badge bg-primary rounded-pill">管理</span>
                            `;
                            list.appendChild(item);
                        });
                    } else {
                        list.innerHTML = '<div class="list-group-item text-center text-muted">暂无对抗赛</div>';
                    }
                });
        }

        document.getElementById('teamMatchForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            const rawData = Object.fromEntries(formData.entries());

            const teamA_players = [];
            const teamB_players = [];
            for (let i = 0; i < 6; i++) {
                teamA_players.push(rawData[`teamAPlayer${i}`]);
                teamB_players.push(rawData[`teamBPlayer${i}`]);
            }

            const payload = {
                name: rawData.name,
                date: rawData.date,
                teamA: {
                    name: rawData.teamAName,
                    players: teamA_players
                },
                teamB: {
                    name: rawData.teamBName,
                    players: teamB_players
                }
            };

            fetch(`${CONFIG.API_VERCEL_NEXTJS_BASE_URL}/api/team-match/create`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        alert('团体对抗赛创建成功！');
                        this.reset();
                        loadTeamMatches();
                    } else {
                        alert('创建失败：' + result.message);
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('发生错误');
                });
        });

        window.onload = loadTeamMatches;
    </script>
</body>

</html>
