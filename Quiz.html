<!doctype html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>围棋答题 - 黑米围棋</title>
  <link rel="stylesheet" href="css/GoBoard4C.css" />
  <link rel="stylesheet" href="css/Styles5.css" />
  <link rel="stylesheet" href="css/Quiz.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="icon" href="https://zgbl.github.io/tigergo/favicon.ico" type="image/x-icon" />
</head>

<body>
  <!-- 添加导航栏 -->
  <div id="navbar-placeholder"></div>

  <div class="quiz-container">
    <!-- 左侧题目设置区域 -->
    <div class="quiz-settings-section">
      <h2 class="settings-title">
        <i class="fas fa-cog"></i>
        题目设置
      </h2>

      <div class="settings-panel">
        <div class="setting-group">
          <label class="setting-label">题目来源</label>
          <select class="setting-select" id="questionSource">
            <option value="all">所有题目</option>
            <option value="recent">最近生成</option>
            <option value="difficulty-easy">简单题目</option>
            <option value="difficulty-medium">中等题目</option>
            <option value="difficulty-hard">困难题目</option>
          </select>
        </div>

        <div class="setting-group">
          <label class="setting-label">题目数量</label>
          <input type="number" class="setting-input" id="questionCount" min="1" max="50" value="10" />
        </div>

        <div class="setting-group">
          <label class="setting-label">随机顺序</label>
          <input type="checkbox" class="setting-checkbox" id="randomOrder" checked />
        </div>
      </div>

      <div class="quiz-controls">
        <button class="quiz-btn primary" id="loadQuestionsBtn">
          <i class="fas fa-download"></i>
          加载题目
        </button>
        <!-- 第73行 - 删除disabled属性 -->
        <button class="quiz-btn secondary" id="resetQuizBtn">
          <i class="fas fa-redo"></i>
          重新开始
        </button>

        <!-- 第77行 - 删除disabled属性 -->
        <button class="quiz-btn secondary" id="nextGroupBtn">
          <i class="fas fa-forward"></i>
          下一组
        </button>
      </div>

      <!-- 题目进度 -->
      <div class="quiz-progress" id="quizProgress" style="display: none">
        <h3 class="progress-title">
          <i class="fas fa-chart-line"></i>
          答题进度
        </h3>
        <div class="progress-info">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-text">
            <span id="currentQuestion">1</span> /
            <span id="totalQuestions">10</span>
          </div>
        </div>
        <div class="score-info">
          <div class="score-item">
            <span class="score-label">正确:</span>
            <span class="score-value correct" id="correctCount">0</span>
          </div>
          <div class="score-item">
            <span class="score-label">错误:</span>
            <span class="score-value incorrect" id="incorrectCount">0</span>
          </div>
          <div class="score-item">
            <span class="score-label">正确率:</span>
            <span class="score-value" id="accuracyRate">0%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 中间主内容区域 -->
    <div class="main-content">
      <div class="board-container">
        <div class="board-placeholder" id="boardPlaceholder">
          <div id="board"></div>
        </div>

        <!-- 候选点标记说明 -->
        <div class="candidate-legend" id="candidateLegend" style="display: none">
          <h4>候选点:</h4>
          <div class="legend-items">
            <div class="legend-item">
              <span class="candidate-marker a">A</span>
              <span class="legend-text">选项A</span>
            </div>
            <div class="legend-item">
              <span class="candidate-marker b">B</span>
              <span class="legend-text">选项B</span>
            </div>
            <div class="legend-item">
              <span class="candidate-marker c">C</span>
              <span class="legend-text">选项C</span>
            </div>
            <div class="legend-item">
              <span class="candidate-marker d">D</span>
              <span class="legend-text">选项D</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 题目信息 (移至棋盘下方，减少抖动) -->
      <div class="question-info" id="questionInfo" style="display: none; margin-top: 12px;">
        <div class="question-title"
          style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <h3 id="questionTitle" style="margin: 0; font-size: 15px; flex: 1;">请选择最佳下法</h3>
          <span class="question-number" id="questionNumber" style="white-space: nowrap;">题目 #1</span>
        </div>
        <div
          style="display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px; color: #6b7280; flex-wrap: wrap;">
          <span class="question-difficulty" id="questionDifficulty">中等</span>
          <span>·</span>
          <span class="question-source" id="questionSource">实战对局</span>
          <span>·</span>
          <span id="gameMetadata" style="color: #6b7280;"></span>
        </div>
      </div>

      <!-- 加载状态 -->
      <div class="loading-state" id="loadingState">
        <div class="loading-content">
          <i class="fas fa-spinner fa-spin"></i>
          <p>请先加载题目开始答题</p>
        </div>
      </div>
    </div>

    <!-- 右侧答题区域 -->
    <div class="answer-section">
      <div class="answer-panel">
        <h3 class="panel-title">
          <i class="fas fa-check-circle"></i>
          选择答案
        </h3>

        <div class="answer-options" id="answerOptions">
          <div class="answer-option">
            <input type="radio" id="optionA" name="answer" value="A" />
            <label for="optionA" class="option-label">
              <span class="option-marker">A</span>
              <span class="option-text">选项A</span>
            </label>
          </div>
          <div class="answer-option">
            <input type="radio" id="optionB" name="answer" value="B" />
            <label for="optionB" class="option-label">
              <span class="option-marker">B</span>
              <span class="option-text">选项B</span>
            </label>
          </div>
          <div class="answer-option">
            <input type="radio" id="optionC" name="answer" value="C" />
            <label for="optionC" class="option-label">
              <span class="option-marker">C</span>
              <span class="option-text">选项C</span>
            </label>
          </div>
          <div class="answer-option">
            <input type="radio" id="optionD" name="answer" value="D" />
            <label for="optionD" class="option-label">
              <span class="option-marker">D</span>
              <span class="option-text">选项D</span>
            </label>
          </div>
        </div>

        <div class="answer-controls">
          <button class="quiz-btn primary" id="submitAnswerBtn">
            <i class="fas fa-check"></i>
            提交答案
          </button>
          <button class="quiz-btn secondary" id="nextQuestionBtn">
            <i class="fas fa-arrow-right"></i>
            下一题
          </button>
        </div>
      </div>

      <!-- 答题结果 -->
      <div class="result-panel" id="resultPanel" style="display: none">
        <h3 class="panel-title">
          <i class="fas fa-chart-bar"></i>
          答题结果
        </h3>

        <div class="result-content" id="resultContent">
          <div class="result-item">
            <div class="result-label">您的答案:</div>
            <div class="result-value" id="userAnswer">-</div>
          </div>
          <div class="result-item">
            <div class="result-label">正确答案:</div>
            <div class="result-value" id="correctAnswer">-</div>
          </div>
          <div class="result-item">
            <div class="result-label">胜率变化:</div>
            <div class="result-value" id="winrateChange">-</div>
          </div>
        </div>
      </div>

      <!-- 最终成绩 -->
      <div class="final-score" id="finalScore" style="display: none">
        <h3 class="panel-title">
          <i class="fas fa-trophy"></i>
          最终成绩
        </h3>

        <div class="score-summary" id="scoreSummary">
          <div class="score-item large">
            <div class="score-label">总正确率</div>
            <div class="score-value" id="finalAccuracy">0%</div>
          </div>
          <div class="score-breakdown">
            <div class="breakdown-item">
              <span class="breakdown-label">正确:</span>
              <span class="breakdown-value correct" id="finalCorrect">0</span>
            </div>
            <div class="breakdown-item">
              <span class="breakdown-label">错误:</span>
              <span class="breakdown-value incorrect" id="finalIncorrect">0</span>
            </div>
            <div class="breakdown-item">
              <span class="breakdown-label">总题数:</span>
              <span class="breakdown-value" id="finalTotal">0</span>
            </div>
          </div>

          <!-- 添加重新开始按钮 -->
          <button class="quiz-btn primary" id="restartQuizBtn">
            <i class="fas fa-redo"></i>
            重新开始
          </button>
        </div>
      </div>

      <!-- 🔊 音量控制：小图标，点击展开 -->
      <div style="position: relative; text-align: right; margin-top: 8px">
        <i class="fas fa-volume-down" id="volumeIcon" style="cursor:pointer; color:#aaa; font-size:14px; padding:4px"
          title="调节音量"></i>
        <div id="volumePopup" style="
              display:none; position:absolute; bottom:28px; right:0;
              background:white; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,0.15);
              padding:8px 12px; white-space:nowrap; z-index:100;
              align-items:center; gap:6px; font-size:12px; color:#666">
          <input type="range" id="volumeSlider" min="0" max="100" value="10"
            style="width:100px; accent-color:#8e44ad; cursor:pointer" />
          <span id="volumeValue" style="min-width:28px; font-weight:600">30%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 音效元素 -->
  <audio id="stoneSound" preload="auto">
    <source src="Sounds/PlayStone2.mp3" type="audio/mpeg" />
  </audio>

  <!-- 添加缺失的音效元素 -->
  <audio id="correctSound" preload="auto">
    <source src="Sounds/correct-choice.mp3" type="audio/mpeg" />
  </audio>

  <audio id="incorrectSound" preload="auto">
    <source src="Sounds/incorrect.mp3" type="audio/mpeg" />
  </audio>

  <!-- JavaScript -->
  <script src="js/config.js"></script>
  <script src="js/GoBoard12.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/QuizBoard.js"></script>
  <script src="js/QuizPage.js"></script>
</body>

</html>
