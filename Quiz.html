<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>围棋答题 - 黑米围棋</title>
    <link rel="stylesheet" href="css/GoBoard4C.css" />
    <link rel="stylesheet" href="css/Styles5.css" />
    <link rel="stylesheet" href="css/Quiz.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      rel="icon"
      href="https://zgbl.github.io/tigergo/favicon.ico"
      type="image/x-icon"
    />
</head>

<body>
    <div id="navbar-placeholder"></div>

    <div class="quiz-container">
        <!-- 左侧题目设置区域 -->
        <div class="quiz-settings-section">
            <h2 class="settings-title">
                <i class="fas fa-cog"></i>
                题目设置
            </h2>
            
            <div class="settings-panel">
                <div class="setting-group">
                    <label class="setting-label">题目来源</label>
                    <select class="setting-select" id="questionSource">
                        <option value="all">所有题目</option>
                        <option value="recent">最近生成</option>
                        <option value="difficulty-easy">简单题目</option>
                        <option value="difficulty-medium">中等题目</option>
                        <option value="difficulty-hard">困难题目</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label class="setting-label">题目数量</label>
                    <input type="number" class="setting-input" id="questionCount" min="1" max="50" value="10" />
                </div>
                
                <div class="setting-group">
                    <label class="setting-label">随机顺序</label>
                    <input type="checkbox" class="setting-checkbox" id="randomOrder" checked />
                </div>
            </div>
            
            <div class="quiz-controls">
                <button class="quiz-btn primary" id="loadQuestionsBtn">
                    <i class="fas fa-download"></i>
                    加载题目
                </button>
                <button class="quiz-btn secondary" id="resetQuizBtn" disabled>
                    <i class="fas fa-redo"></i>
                    重新开始
                </button>
                <button class="quiz-btn secondary" id="nextGroupBtn" disabled>
                    <i class="fas fa-forward"></i>
                    下一组
                </button>
            </div>
            
            <!-- 题目进度 -->
            <div class="quiz-progress" id="quizProgress" style="display: none;">
                <h3 class="progress-title">
                    <i class="fas fa-chart-line"></i>
                    答题进度
                </h3>
                <div class="progress-info">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text">
                        <span id="currentQuestion">1</span> / <span id="totalQuestions">10</span>
                    </div>
                </div>
                <div class="score-info">
                    <div class="score-item">
                        <span class="score-label">正确:</span>
                        <span class="score-value correct" id="correctCount">0</span>
                    </div>
                    <div class="score-item">
                        <span class="score-label">错误:</span>
                        <span class="score-value incorrect" id="incorrectCount">0</span>
                    </div>
                    <div class="score-item">
                        <span class="score-label">正确率:</span>
                        <span class="score-value" id="accuracyRate">0%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 中间主内容区域 -->
        <div class="main-content">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="fas fa-brain"></i>
                    围棋答题
                </h1>
                <p class="page-subtitle">测试您的围棋技能</p>
            </div>

            <!-- 题目信息 -->
            <div class="question-info" id="questionInfo" style="display: none;">
                <div class="question-title">
                    <h3 id="questionTitle">请选择最佳下法</h3>
                    <span class="question-number" id="questionNumber">题目 #1</span>
                </div>
                <div class="question-meta">
                    <span class="question-difficulty" id="questionDifficulty">难度: 中等</span>
                    <span class="question-source" id="questionSource">来源: 实战对局</span>
                </div>
            </div>

            <div class="board-container">
                <div class="board-placeholder" id="boardPlaceholder">
                    <div id="board"></div>
                </div>
                
                <!-- 候选点标记说明 -->
                <div class="candidate-legend" id="candidateLegend" style="display: none;">
                    <h4>候选点:</h4>
                    <div class="legend-items">
                        <div class="legend-item">
                            <span class="candidate-marker a">A</span>
                            <span class="legend-text">选项A</span>
                        </div>
                        <div class="legend-item">
                            <span class="candidate-marker b">B</span>
                            <span class="legend-text">选项B</span>
                        </div>
                        <div class="legend-item">
                            <span class="candidate-marker c">C</span>
                            <span class="legend-text">选项C</span>
                        </div>
                        <div class="legend-item">
                            <span class="candidate-marker d">D</span>
                            <span class="legend-text">选项D</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 加载状态 -->
            <div class="loading-state" id="loadingState">
                <div class="loading-content">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>请先加载题目开始答题</p>
                </div>
            </div>
        </div>

        <!-- 右侧答题区域 -->
        <div class="answer-section">
            <div class="answer-panel">
                <h3 class="panel-title">
                    <i class="fas fa-check-circle"></i>
                    选择答案
                </h3>
                
                <div class="answer-options" id="answerOptions">
                    <div class="answer-option">
                        <input type="radio" id="optionA" name="answer" value="A" />
                        <label for="optionA" class="option-label">
                            <span class="option-marker">A</span>
                            <span class="option-text">选项A</span>
                        </label>
                    </div>
                    <div class="answer-option">
                        <input type="radio" id="optionB" name="answer" value="B" />
                        <label for="optionB" class="option-label">
                            <span class="option-marker">B</span>
                            <span class="option-text">选项B</span>
                        </label>
                    </div>
                    <div class="answer-option">
                        <input type="radio" id="optionC" name="answer" value="C" />
                        <label for="optionC" class="option-label">
                            <span class="option-marker">C</span>
                            <span class="option-text">选项C</span>
                        </label>
                    </div>
                    <div class="answer-option">
                        <input type="radio" id="optionD" name="answer" value="D" />
                        <label for="optionD" class="option-label">
                            <span class="option-marker">D</span>
                            <span class="option-text">选项D</span>
                        </label>
                    </div>
                </div>
                
                <div class="answer-controls">
                    <button class="quiz-btn primary" id="submitAnswerBtn" disabled>
                        <i class="fas fa-paper-plane"></i>
                        提交答案
                    </button>
                    <button class="quiz-btn secondary" id="nextQuestionBtn" disabled>
                        <i class="fas fa-arrow-right"></i>
                        下一题
                    </button>
                </div>
            </div>
            
            <!-- 答题结果 -->
            <div class="result-panel" id="resultPanel" style="display: none;">
                <h3 class="panel-title">
                    <i class="fas fa-chart-bar"></i>
                    答题结果
                </h3>
                
                <div class="result-content" id="resultContent">
                    <!-- 结果内容将通过JavaScript动态填充 -->
                </div>
            </div>
            
            <!-- 最终成绩 -->
            <div class="final-score" id="finalScore" style="display: none;">
                <h3 class="panel-title">
                    <i class="fas fa-trophy"></i>
                    最终成绩
                </h3>
                
                <div class="score-summary" id="scoreSummary">
                    <!-- 最终成绩将通过JavaScript动态填充 -->
                </div>
                
                <button class="quiz-btn primary" id="restartQuizBtn">
                    <i class="fas fa-redo"></i>
                    重新答题
                </button>
            </div>
        </div>
    </div>

    <!-- 音效 -->
    <audio id="correctSound" preload="auto">
        <source src="Sounds/correct.mp3" type="audio/mpeg">
    </audio>
    <audio id="incorrectSound" preload="auto">
        <source src="Sounds/incorrect.mp3" type="audio/mpeg">
    </audio>
    <audio id="stoneSound" preload="auto">
        <source src="Sounds/PlayStone2.mp3" type="audio/mpeg">
    </audio>

    <!-- JavaScript -->
    <script src="js/navbar2.js"></script>
    <script src="js/GoBoard12.js"></script>
    <script src="js/config.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/QuizBoard.js"></script>  <!-- 新增 -->
    <script src="js/QuizPage.js"></script>
</body>
</html>
