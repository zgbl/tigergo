    <!-- 🔥 新增：从Post11.html复制的棋盘创建代码 -->
    <script>
      const maxWinSize = 3000;
      const minWinSize = 300;
      
      // 🔥 新增：计算棋盘大小的函数（从Post11.html复制）
      function calculateBoardSize() {
        const winWidth = window.innerWidth;
        const winHeight = window.innerHeight;
        
        let cellSizeFromWidth, cellSizeFromHeight;

        // 根据宽度计算 cellSize
        if (winWidth < 480) {
          cellSizeFromWidth = Math.floor((winWidth - 20) / 20);
          if (winWidth < minWinSize) {
            cellSizeFromWidth = Math.floor((minWinSize - 20) / 20);
          }
        } else if (winWidth > 768) {
          cellSizeFromWidth = Math.floor(winWidth / 28);
          if (winWidth > maxWinSize) {
            cellSizeFromWidth = Math.floor(maxWinSize / 28);
          }
        } else {
          cellSizeFromWidth = 30;
        }

        // 根据高度计算 cellSize
        if (winHeight < 480) {
          cellSizeFromHeight = Math.floor((winHeight - 20) / 20);
          if (winHeight < minWinSize) {
            cellSizeFromHeight = Math.floor((minWinSize - 20) / 20);
          }
        } else if (winHeight > 768) {
          cellSizeFromHeight = Math.floor(winHeight / 25);
          if (winHeight > maxWinSize) {
            cellSizeFromHeight = Math.floor(maxWinSize / 25);
          }
        } else {
          cellSizeFromHeight = 30;
        }

        let cellSize = Math.min(cellSizeFromWidth, cellSizeFromHeight);
        const boardSize = 19;
        const stoneSize = Math.floor(cellSize * 0.95);
        let maxFrameWidth = cellSize * (boardSize + 3);

        return { cellSize, stoneSize, maxFrameWidth };
      }

      // 🔥 新增：更新CSS变量的函数（从Post11.html复制）
      function updateStoneSizeCSS(cellSize) {
        document.documentElement.style.setProperty(
          "--stone-size",
          `${cellSize}px`
        );
        document.documentElement.style.setProperty(
          "--cell-size",
          `${cellSize}px`
        );
        document.documentElement.style.setProperty(
          "--font-size",
          `${cellSize * 0.4}px`
        );
      }

      // 🔥 新增：创建棋盘的函数（从Post11.html复制）
      function createBoard3(options) {
        let {
            domElement,
            boardSize = 19,
            cellSize,
            lineColor = '#000',
            backgroundColor = '#DEB887'
        } = options;

        domElement.innerHTML = '';
        console.log('Creating board on element', domElement);
        domElement.style.width = `${boardSize * cellSize}px`;
        domElement.style.height = `${boardSize * cellSize}px`;
        domElement.style.position = 'relative';
        domElement.style.backgroundColor = backgroundColor;

        // 绘制棋盘线
        for (let i = 0; i < boardSize; i++) {
            // 垂直线
            const vertical = document.createElement('div');
            vertical.style.position = 'absolute';
            vertical.style.left = `${cellSize/2 + i * cellSize}px`;
            vertical.style.top = `${cellSize/2}px`;
            vertical.style.width = '1px';
            vertical.style.height = `${(boardSize - 1) * cellSize}px`;
            vertical.style.backgroundColor = lineColor;
            vertical.style.zIndex = '1';
            domElement.appendChild(vertical);

            // 水平线
            const horizontal = document.createElement('div');
            horizontal.style.position = 'absolute';
            horizontal.style.left = `${cellSize/2}px`;
            horizontal.style.top = `${cellSize/2 + i * cellSize}px`;
            horizontal.style.width = `${(boardSize - 1) * cellSize}px`;
            horizontal.style.height = '1px';
            horizontal.style.backgroundColor = lineColor;
            horizontal.style.zIndex = '1';
            domElement.appendChild(horizontal);
        }

        // 创建交叉点
        for (let i = 0; i < boardSize; i++) {
            for (let j = 0; j < boardSize; j++) {
                const intersection = document.createElement('div');
                intersection.className = 'intersection';
                intersection.dataset.row = i;
                intersection.dataset.col = j;
                intersection.style.position = 'absolute';
                intersection.style.left = `${j * cellSize}px`;
                intersection.style.top = `${i * cellSize}px`;
                intersection.style.width = `${cellSize}px`;
                intersection.style.height = `${cellSize}px`;
                intersection.style.zIndex = '2';
                intersection.addEventListener('click', (e) => handleClick(e));

                domElement.appendChild(intersection);
            }
        }

        // 添加星位
        const starPoints = [
            [3, 3], [3, 9], [3, 15],
            [9, 3], [9, 9], [9, 15],
            [15, 3], [15, 9], [15, 15]
        ];

        starPoints.forEach(([row, col]) => {
            const intersection = domElement.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            if (intersection) {
                const starPoint = document.createElement('div');
                starPoint.style.position = 'absolute';
                starPoint.style.top = '50%';
                starPoint.style.left = '50%';
                starPoint.style.transform = 'translate(-50%, -50%)';
                starPoint.style.width = `${cellSize * 0.2}px`;
                starPoint.style.height = `${cellSize * 0.2}px`;
                starPoint.style.backgroundColor = lineColor;
                starPoint.style.borderRadius = '50%';
                starPoint.style.zIndex = '3';
                intersection.appendChild(starPoint);
            }
        });

        console.log('Board creation completed');
      }

      // 🔥 新增：点击处理函数（从Post11.html复制，简化版）
      function handleClick(event) {
        try {
          const row = parseInt(event.target.dataset.row, 10);
          const col = parseInt(event.target.dataset.col, 10);

          if (isNaN(row) || isNaN(col)) {
            console.log("Invalid intersection clicked");
            return;
          }

          console.log(`Clicked on intersection: (${row}, ${col})`);
          // 在分析页面中，可能需要根据具体需求处理点击事件
          
        } catch (error) {
          console.error("Error in handleClick:", error.message);
        }
      }

      // 🔥 新增：初始化棋盘和添加必要的全局变量
      function initializeBoard() {
        console.log("初始化棋盘");
        
        // 🔥 添加必要的全局变量，防止GoBoard12.js报错
        window.currentMoves = [];
        window.currentMoveIndex = -1;
        window.displayMode = 0;
        window.showingRecentMoves = false;
        
        // 计算棋盘大小
        let { cellSize, stoneSize } = calculateBoardSize();
        console.log("计算得到的 cellSize:", cellSize);
        
        // 更新CSS变量
        updateStoneSizeCSS(cellSize);
        
        // 创建棋盘
        const mainBoard = document.getElementById("board");
        if (mainBoard) {
          createBoard3({
            domElement: mainBoard,
            boardSize: 19,
            cellSize: cellSize,
          });
          console.log("棋盘创建完成");
        } else {
          console.error("找不到棋盘容器元素");
        }
      }

      // 🔥 新增：页面加载完成后初始化棋盘
      document.addEventListener('DOMContentLoaded', function() {
        console.log('SGFAnalysis.html DOMContentLoaded');
        
        // 加载导航栏
        if (typeof loadNavbar === 'function') {
          loadNavbar();
        }
        
        // 初始化棋盘
        initializeBoard();
        
        // 🔥 新增：添加icon按钮的事件监听器（参考Post11.html）
        const iconButtons = [
          { id: 'logostartBtn', handler: () => { if (typeof moveToStart === 'function') moveToStart(); } },
          { id: 'logofastBackwardBtn', handler: () => { if (typeof fastBackward === 'function') fastBackward(); } },
          { id: 'logobackwardBtn', handler: () => { if (typeof moveBackward === 'function') moveBackward(); } },
          { id: 'logoforwardBtn', handler: () => { if (typeof moveForward === 'function') moveForward(); } },
          { id: 'logofastForwardBtn', handler: () => { if (typeof fastForward === 'function') fastForward(); } },
          { id: 'logoendBtn', handler: () => { if (typeof moveToEnd === 'function') moveToEnd(); } },
          { id: 'logoshowMovesBtn', handler: () => { if (typeof toggleMoveDisplay === 'function') toggleMoveDisplay(); } }
        ];

        iconButtons.forEach(({ id, handler }) => {
          const btn = document.getElementById(id);
          if (btn) {
            btn.addEventListener('click', handler);
            console.log(`已添加 ${id} 事件监听器`);
          } else {
            console.warn(`按钮 ${id} 未找到`);
          }
        });
        
        console.log('SGFAnalysis.html 初始化完成');
      });

      // 🔥 修改：窗口大小改变时只重新计算棋盘大小，不重新初始化
      window.addEventListener('resize', function() {
        console.log('窗口大小改变，重新计算棋盘大小');
        
        // 只重新计算和更新CSS变量，不重新创建棋盘
        let { cellSize, stoneSize } = calculateBoardSize();
        console.log("重新计算得到的 cellSize:", cellSize);
        
        // 更新CSS变量
        updateStoneSizeCSS(cellSize);
        
        // 更新棋盘容器大小
        const mainBoard = document.getElementById("board");
        if (mainBoard) {
          const boardSize = 19;
          mainBoard.style.width = `${boardSize * cellSize}px`;
          mainBoard.style.height = `${boardSize * cellSize}px`;
          
          // 更新所有交叉点的大小
          const intersections = mainBoard.querySelectorAll('.intersection');
          intersections.forEach(intersection => {
            intersection.style.width = `${cellSize}px`;
            intersection.style.height = `${cellSize}px`;
          });
          
          // 重新定位所有元素
          const lines = mainBoard.querySelectorAll('div');
          lines.forEach(line => {
            if (line.style.position === 'absolute') {
              // 重新计算线条位置
              const isVertical = line.style.height.includes('px') && parseInt(line.style.height) > 10;
              const isHorizontal = line.style.width.includes('px') && parseInt(line.style.width) > 10;
              
              if (isVertical) {
                const leftIndex = Math.round(parseFloat(line.style.left) / window.oldCellSize || cellSize);
                line.style.left = `${cellSize/2 + leftIndex * cellSize}px`;
                line.style.top = `${cellSize/2}px`;
                line.style.height = `${(boardSize - 1) * cellSize}px`;
              } else if (isHorizontal) {
                const topIndex = Math.round(parseFloat(line.style.top) / window.oldCellSize || cellSize);
                line.style.left = `${cellSize/2}px`;
                line.style.top = `${cellSize/2 + topIndex * cellSize}px`;
                line.style.width = `${(boardSize - 1) * cellSize}px`;
              }
            }
          });
          
          // 重新定位交叉点
          intersections.forEach(intersection => {
            const row = parseInt(intersection.dataset.row);
            const col = parseInt(intersection.dataset.col);
            intersection.style.left = `${col * cellSize}px`;
            intersection.style.top = `${row * cellSize}px`;
          });
          
          window.oldCellSize = cellSize;
          console.log("棋盘大小已更新");
        }
      });
    </script>

  </body>
