<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forum11.html /opt/homebrew/var/www</title>
    <link rel="stylesheet" href="css/Styles5.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <style></style>
    <script src="js/config.js"></script>
  </head>
  <body>
    <div id="root">
        <!-- forum7.html 开始使用页面响应式设计 -->
      <div id="navbar-placeholder"></div>

      <div class="container forum-container">
        <div class="header-container">
          <h2>围棋论坛-11</h2>
          <div id="UserHandle">
            <div id="user-info">
              <!-- 用户信息将在这里显示 -->
            </div>
            <button id="logoutButton" class="logout-button">Logout</button>
          </div>
        </div>

        <div id="post-list-header" class="post-list-header">
            <div class="post-title">标题</div>
            <div class="author-header">作者</div>
            <div class="reply-count-header">回复/查看</div>
            <div class="last-post-time-header">最后发表</div>
        </div>

        <div id="post-list" class="post-list">
          <!-- 帖子将通过JavaScript动态加载 -->
        </div>

        <button id="load-more">加载更多</button>

    <div class="new-post-section">
        <h3>发布新帖子</h3>
        <form id="new-post-form" enctype="multipart/form-data">
        <input type="text" name="title" placeholder="输入帖子标题" required />
        <textarea name="content" placeholder="在此输入帖子内容" required></textarea> 
        <input type="file" name="sgfFile" accept=".sgf,.gib" required />
        <p>接受 .sgf 和 .gib</p>
        
        <div class="form-footer">
            <input type="submit" value="发布帖子" />
        </div>
        </form>
        </div>

    </div>
    

    <script src="js/navbar.js"></script>
    <!--<script src="js/Page.js"></script> -->
    <script type="module">
      import { initUserInfo } from './js/Page3.js';
      initUserInfo("user-info"); // 或其他 ID
    </script>
    <script>
      // 加载导航栏
      loadNavbar();
      let currentPage = 1;

      // 修复后的表单提交处理 - 手动控制每个字段
      document.getElementById("new-post-form").addEventListener("submit", function (e) {
        e.preventDefault();
        
        // 直接获取表单值，不使用 FormData(this)
        const titleInput = document.querySelector('input[name="title"]');
        const contentInput = document.querySelector('textarea[name="content"]');
        const fileInput = document.querySelector('input[name="sgfFile"]');
        
        console.log("=== 表单元素检查 ===");
        console.log("title input:", titleInput);
        console.log("content input:", contentInput);
        console.log("file input:", fileInput);
        
        if (!titleInput || !contentInput) {
          alert("表单元素未找到！请检查HTML结构");
          return;
        }
        
        const title = titleInput.value.trim();
        const content = contentInput.value.trim();
        const file = fileInput ? fileInput.files[0] : null;
        
        console.log("=== 表单值检查 ===");
        console.log("title:", `"${title}"`);
        console.log("content:", `"${content}"`);
        console.log("file:", file);
        
        if (!title || !content) {
          alert("请填写标题和内容！");
          return;
        }
        
        // 获取用户信息
        const user = JSON.parse(localStorage.getItem("user"));
        console.log("=== 用户信息检查 ===");
        console.log("user:", user);
        
        if (!user || !user._id || !user.username) {
          alert("请先登录！");
          return;
        }
        
        // 手动创建 FormData
        const formData = new FormData();
        formData.append('title', title);
        formData.append('content', content);
        formData.append('author', user.username);
        formData.append('userId', user._id);
        
        if (file) {
          formData.append('sgfFile', file);
        }
        
        // 验证 FormData
        console.log("=== 最终 FormData 内容 ===");
        for (let [key, value] of formData.entries()) {
          console.log(`${key}: ${value}`);
        }
        
        const requestUrl = `${CONFIG.API_BASE_URL}/forum/Posts`;  // 改回 Posts
        console.log("=== 发送请求 ===");
        console.log("请求URL:", requestUrl);
        
        // 发送请求
        fetch(requestUrl, {
          method: "POST",
          body: formData,
        })
        .then((response) => {
          console.log("响应状态:", response.status);
          if (!response.ok) {
            return response.text().then(text => {
              throw new Error(`HTTP 错误! 状态: ${response.status}, 详情: ${text}`);
            });
          }
          return response.json();
        })
        .then((data) => {
          console.log("服务器响应:", data);
          if (data.success) {
            alert("帖子发布成功！");
            this.reset();
            currentPage = 1;
            refreshPostList(currentPage, false);
          } else {
            alert("发布失败: " + (data.message || "未知错误"));
          }
        })
        .catch((error) => {
          console.error("错误:", error);
          alert("发布时发生错误: " + error.message);
        });
      });

      // 在发帖成功后刷新帖子列表
      function refreshPostList(page = 1, append = false) {
        const postListElement = document.getElementById('post-list');
        
        if (!postListElement) {
          console.error('Post list element not found');
          return;
        }
        
        const requestUrl = `${CONFIG.API_BASE_URL}/forum/Posts?page=${page}`;  // 改回 Posts
        console.log("正在获取帖子列表:", requestUrl);
        
        fetch(requestUrl)
          .then((response) => {
            console.log("获取帖子列表响应状态:", response.status);
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
          })
          .then((data) => {
            //console.log("获取到的帖子数据:", data);
            const postinfo = data.posts || data.data || [];  //临时调试用
            
            const postList = document.getElementById("post-list");
            if (!append) {
              postList.innerHTML = "";
            }
              // 只打印第一个帖子的结构
            
              if (postinfo.length > 0) {
              console.log('=== 第一个帖子的数据结构 ===');
              console.log(JSON.stringify(postinfo[0], null, 2));  //临时调试用
              console.log('可用字段:', Object.keys(postinfo[0]));  //临时调试用
            } 

            // 处理不同的数据结构
            const posts = data.posts || data.data || [];
            
            posts.forEach((post) => {
              const postElement = document.createElement("div");
              postElement.className = "form-post";
              postElement.innerHTML = `
                <a href="Post11.html?id=${encodeURIComponent(post._id)}" class="post-link">
                  <div class="post-content">
                    <div class="post-title">${post.title || "Untitled"}</div>
                    <div class="post-body">${post.content || "No content"}</div>
                  </div>
                  ${
                    post.filePath
                      ? '<i class="fas fa-paperclip attachment-icon" title="附件"></i>'
                      : ""
                  }
                </a>
               
                <div class="post-auther">${post.author || "Unknown"}</div>
                <div class="post-reply-count">${post.replyCount || 0}</div>
                <div class="post-last-post-time">${post.updatedAt || "N/A"}</div>
           
              `;
              postListElement.appendChild(postElement);
            });

            const loadMoreButton = document.getElementById("load-more");
            loadMoreButton.style.display = data.hasNextPage ? "block" : "none";
          })
          .catch((error) => {
            console.error("Error fetching posts:", error);
            alert("获取帖子列表时发生错误: " + error.message);
          });
      }

      document.getElementById("load-more").addEventListener("click", () => {
        currentPage++;
        refreshPostList(currentPage, true);
      });

      // 页面加载时刷新帖子列表
      document.addEventListener("DOMContentLoaded", () =>
        refreshPostList(currentPage, false)
      );

      document.getElementById('logoutButton').addEventListener('click', async () => {
        try {
            const response = await fetch(`${CONFIG.API_VERCEL_NEXTJS_BASE_URL}/api/logout`, {
                method: 'GET',
                credentials: 'include'
            });
            const data = await response.json();
            if (response.ok) {
                alert(data.message);
                window.location.href = '/'; // Redirect to login page after logout
            } else {
                throw new Error(data.message);
            }
        } catch (error) {
            console.error('Logout failed:', error);
            alert('登出失败，请稍后重试');
        }
      });

    </script>
  </body>
</html>
