<!doctype html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>题目制作 - 黑米围棋</title>
  <link rel="stylesheet" href="css/GoBoard4C.css" />
  <link rel="stylesheet" href="css/Styles5.css" />
  <link rel="stylesheet" href="css/SGFAnalysis.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="icon" href="https://zgbl.github.io/tigergo/favicon.ico" type="image/x-icon" />
  <style>
    /* 题目制作页面专用样式 overrides */
    :root {
      --primary-color: var(--primary-btn);
      --success-color: var(--success-btn);
      --warning-color: var(--accent-btn);
      --verify-color: var(--secondary-btn);
      --danger-color: var(--danger-btn);
      --text-main: var(--text-main);
      --text-soft: var(--text-soft);
      --bg-soft: var(--bg-soft, #f1f5f9);
      --sidebar-width: 280px;
    }

    .analysis-container {
      display: grid;
      grid-template-columns: var(--sidebar-width) 6px 1fr 280px;
      /* 增加 resize handle 列 */
      gap: 0 !important;
      /* 移除间距以支持 handle */
      padding: 5px !important;
      height: calc(100vh - 60px);
      /* 减去可能的导航栏高度 */
    }

    .resize-handle {
      width: 6px;
      cursor: col-resize;
      background: transparent;
      transition: background 0.2s;
      z-index: 100;
    }

    .resize-handle:hover,
    .resize-handle.active {
      background: var(--primary-color);
    }

    .editor-section {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      padding: 8px !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #eee;
      height: 100%;
      overflow-y: auto;
    }

    .candidate-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .candidate-item {
      background: white;
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }

    .candidate-item:hover {
      border-color: var(--primary-color);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .candidate-label {
      font-weight: bold;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--primary-color);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      margin-right: 10px;
    }

    .candidate-info {
      flex: 1;
      font-size: 12px;
    }

    .candidate-actions {
      display: flex;
      gap: 5px;
    }

    .mode-toggle {
      display: flex;
      background: #eee;
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
    }

    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      color: #666;
      font-weight: 500;
    }

    .mode-btn.active {
      background: white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      color: var(--primary-color);
      font-weight: bold;
    }

    .mode-btn:not(.active):hover {
      background: rgba(0, 0, 0, 0.03);
      color: #333;
    }

    /* 胜率损失排行面板 */
    .loss-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 480px;
      overflow-y: auto;
    }

    .loss-item {
      display: flex;
      align-items: center;
      padding: 7px 8px;
      margin-bottom: 4px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
      font-size: 12px;
      gap: 6px;
    }

    .loss-item:hover {
      background: #f1f5f9;
      border-color: var(--primary-color);
    }

    .loss-item.active {
      background: #e2e8f0;
      border-color: #475569;
      font-weight: bold;
    }

    /* 重构排行榜列表项内部布局 */
    .loss-item .rank-num {
      width: 25px;
      color: #999;
      font-size: 11px;
      text-align: center;
    }

    .loss-item .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid #ccc;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .loss-item .move-num {
      width: 45px;
      font-weight: bold;
      color: #2c3e50;
    }

    .loss-item .coord-info {
      width: 45px;
      color: #7f8c8d;
      font-family: monospace;
    }

    .loss-item .wr-stats {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding-right: 15px;
      min-width: 60px;
      /* 保证数字不重叠 */
    }

    .loss-item .wr-stats .curr-wr {
      font-weight: bold;
      color: #34495e;
    }

    .loss-item .wr-stats .prev-wr {
      font-size: 11px;
      color: #95a5a6;
    }

    .loss-item .loss-badge-container {
      width: 75px;
      text-align: right;
      flex-shrink: 0;
    }

    .loss-item .loss-badge {
      font-weight: bold;
      font-size: 13px;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      min-width: 55px;
    }

    .loss-item .loss-badge.loss {
      background: #fff0f0;
      color: #e74c3c;
    }

    .loss-item .loss-badge.gain {
      background: #f0fff0;
      color: #27ae60;
    }

    .loss-item .loss-badge.neutral {
      background: transparent;
      color: #333;
    }

    .loss-rank {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: white;
      flex-shrink: 0;
    }

    .loss-rank.top3 {
      background: #ef4444;
    }

    .loss-rank.top10 {
      background: #d97706;
    }

    .loss-rank.normal {
      background: #95a5a6;
    }

    .loss-move-num {
      font-weight: 600;
      min-width: 28px;
      color: #2c3e50;
    }

    .loss-color {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid #bbb;
      flex-shrink: 0;
    }

    .loss-color.black {
      background: #222;
    }

    .loss-color.white {
      background: #fff;
    }

    .loss-coord {
      color: #666;
      min-width: 28px;
    }

    .loss-bar-container {
      flex: 1;
      height: 16px;
      background: #f0f0f0;
      border-radius: 8px;
      overflow: hidden;
      min-width: 50px;
    }

    .loss-bar {
      height: 100%;
      border-radius: 8px;
      transition: width 0.3s;
    }

    .loss-bar.severe {
      background: #ef4444;
    }

    .loss-bar.moderate {
      background: #d97706;
    }

    .loss-bar.minor {
      background: linear-gradient(90deg, #f39c12, #e08e0b);
    }

    .loss-bar.tiny {
      background: linear-gradient(90deg, #95a5a6, #7f8c8d);
    }

    .loss-value {
      font-weight: 700;
      min-width: 42px;
      text-align: right;
      font-size: 11px;
    }

    .loss-value.severe {
      color: #e74c3c;
    }

    .loss-value.moderate {
      color: #e67e22;
    }

    .loss-value.minor {
      color: #f39c12;
    }

    .loss-value.tiny {
      color: #95a5a6;
    }

    .loss-empty {
      text-align: center;
      color: #999;
      font-size: 12px;
      padding: 20px 10px;
    }

    /* 胜率图表区域 */
    .chart-section {
      background: white;
      border-radius: 8px;
      padding: 5px !important;
      margin-top: 10px !important;
      /* 增加与控制按钮的间距 */
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05) !important;
      border: 1px solid #eee;
      width: 100%;
    }

    #winrateChart {
      width: 100% !important;
      height: 140px !important;
    }

    /* 🔥 关键：强制修正棋盘偏移，解决 margin-left: 50px 的遗传问题 */
    #board {
      margin-left: 0 !important;
      margin-right: 0 !important;
      margin-bottom: 0 !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2) !important;
    }

    /* 优化棋盘占位容器：移除背景，集中于棋盘本身 */
    .board-placeholder {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 10px 0 !important;
    }

    /* 极简导航控制 */
    #controls2 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      margin: 2px 0 !important;
      padding: 2px 0 !important;
      border: none !important;
      background: transparent !important;
    }

    #controls2 .control-btn {
      padding: 0 !important;
      font-size: 28px;
      /* 增大一倍的标志大小 */
      min-width: 48px;
      /* 与高度匹配，使其更方正 */
      height: 48px;
      box-shadow: none !important;
      margin: 0 !important;
      background: transparent !important;
      border: 1px solid #eee !important;
      border-radius: 4px;
      color: #2a2828;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #controls2 .control-btn:hover {
      background: #f0f7ff !important;
      border-color: #3498db !important;
      color: #3498db;
    }

    #moveInfo {
      font-size: 13px !important;
      font-weight: bold;
      color: #444 !important;
      margin-right: 15px !important;
      background: none !important;
      border: none !important;
      padding: 0 !important;
    }

    .control-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 24px;
      background: #4a5568 !important;
      /* 默认深灰色背景，解决“看不见”问题 */
      border: 1px solid rgba(0, 0, 0, 0.2) !important;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      color: #ffffff;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15) !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .control-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2) !important;
      background: #2d3748 !important;
    }

    .control-btn:active {
      transform: translateY(0);
    }

    .btn-verify {
      background: var(--verify-color) !important;
    }

    .btn-verify:hover {
      background: #5b4cc4 !important;
    }

    .btn-primary {
      background: var(--primary-color) !important;
    }

    .btn-primary:hover {
      background: #2980b9 !important;
    }

    .btn-success {
      background: var(--success-color) !important;
    }

    .btn-success:hover {
      background: #219150 !important;
    }

    .btn-warning {
      background: var(--warning-color) !important;
    }

    .btn-warning:hover {
      background: #d35400 !important;
    }

    .btn-secondary {
      background: var(--secondary-btn, #718096) !important;
    }

    .btn-secondary:hover {
      background: #4a5568 !important;
    }

    .analysis-panel {
      margin-bottom: 8px;
      padding: 8px;
    }

    .panel-title {
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      border-left: 4px solid var(--primary-color);
      padding-left: 10px;
    }

    .page-header {
      padding: 5px 15px !important;
    }

    /* 🔥 题目设置相关样式 */
    .setting-group {
      margin-bottom: 12px;
    }

    .setting-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 5px;
    }

    .setting-input,
    .setting-select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      background: white;
      transition: border-color 0.2s;
    }

    .setting-input:focus,
    .setting-select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    /* 🔥 音量控制样式优化 */
    .volume-btn {
      min-width: 36px !important;
      height: 36px !important;
      font-size: 18px !important;
      border: 1px solid #ddd !important;
      border-radius: 50% !important;
      background: white !important;
      color: #666 !important;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      margin-left: 10px !important;
    }

    .volume-btn:hover {
      background: #f8f9fa !important;
      color: #3498db !important;
      border-color: #3498db !important;
    }

    .volume-popup {
      display: none;
      position: absolute;
      bottom: 50px;
      /* 距离按钮的高度 */
      right: 0;
      background: white;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      z-index: 2000;
      min-width: 140px;
      border: 1px solid #eee;
    }

    .volume-popup::after {
      content: '';
      position: absolute;
      top: 100%;
      right: 15px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid white;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div id="navbar-placeholder"></div>

  <div class="analysis-container">
    <!-- 左侧：发现与导航 -->
    <div class="sidebar">
      <div class="analysis-panel">
        <h3 class="panel-title">
          <i class="fas fa-file-alt"></i>
          棋谱信息
        </h3>
        <div id="gameInfoDisplay" style="font-size: 12px; line-height: 1.5; color: #555">
          加载中...
        </div>
        <button id="switchGameBtn" class="control-btn btn-secondary"
          style="width: 100%; justify-content: center; margin-top: 10px;">
          <i class="fas fa-exchange-alt"></i> 切换棋谱
        </button>
      </div>

      <div class="analysis-panel">
        <h3 class="panel-title">
          <i class="fas fa-search"></i>
          寻找题目素材
        </h3>
        <div class="setting-group">
          <label class="setting-label">最小胜率损失 (%)</label>
          <input type="number" id="minWinrateLoss" class="setting-input" value="5" min="1" max="50" />
        </div>
        <div class="setting-group">
          <label class="setting-label">最小目数损失 (目)</label>
          <input type="number" id="minScoreLoss" class="setting-input" value="2.0" step="0.5" min="0.5" />
        </div>
        <button id="findNextBtn" class="control-btn btn-secondary" style="width: 100%; justify-content: center">
          <i class="fas fa-chevron-right"></i> 寻找下一个失误点
        </button>
      </div>

      <div class="analysis-panel">
        <h3 class="panel-title">
          <i class="fas fa-chart-bar"></i> 胜率损失排行
        </h3>

        <div class="filter-group" style="display: flex; gap: 5px; margin-bottom: 12px">
          <button class="filter-btn active" id="filterAll" style="
                flex: 1;
                padding: 4px 8px;
                font-size: 12px;
                border-radius: 6px;
                border: 1px solid #ddd;
                background: white;
                cursor: pointer;
              ">
            全部
          </button>
          <button class="filter-btn" id="filterBlack" style="
                flex: 1;
                padding: 4px 8px;
                font-size: 12px;
                border-radius: 6px;
                border: 1px solid #ddd;
                background: white;
                cursor: pointer;
              ">
            黑棋
          </button>
          <button class="filter-btn" id="filterWhite" style="
                flex: 1;
                padding: 4px 8px;
                font-size: 12px;
                border-radius: 6px;
                border: 1px solid #ddd;
                background: white;
                cursor: pointer;
              ">
            白棋
          </button>
        </div>

        <ul class="loss-list" id="winrateLossList">
          <li class="loss-empty">加载分析数据后自动显示...</li>
        </ul>
      </div>
    </div>

    <!-- Resize handle -->
    <div class="resize-handle" id="leftResizeHandle"></div>

    <!-- 中间：棋盘 -->
    <div class="main-content" style="padding: 0 !important">
      <div class="page-header" style="margin: 0 !important; padding: 2px 10px !important">
        <h1 class="page-title" style="font-size: 16px; margin: 0 !important; color: white;">
          <i class="fas fa-pencil-alt"></i>
          题目制作
        </h1>
      </div>

      <div class="board-container" style="padding: 0 !important; margin: 0 !important">
        <div class="board-placeholder" id="boardPlaceholder" style="margin: 0 auto !important; padding: 0 !important">
          <div id="board"></div>
        </div>

        <div id="controls2">
          <div id="moveInfo">1 / 0</div>

          <button id="logostartBtn" class="control-btn" title="回到开始">
            <i class="fas fa-fast-backward"></i>
          </button>
          <button id="logofastBackwardBtn" class="control-btn" title="快退">
            <i class="fas fa-step-backward"></i>
          </button>
          <button id="logobackwardBtn" class="control-btn" title="上一步">
            <i class="fa-solid fa-square-caret-left"></i>
          </button>
          <button id="logoforwardBtn" class="control-btn" title="下一步">
            <i class="fa-solid fa-square-caret-right"></i>
          </button>
          <button id="logofastForwardBtn" class="control-btn" title="快进">
            <i class="fas fa-step-forward"></i>
          </button>
          <button id="logoendBtn" class="control-btn" title="前进到底">
            <i class="fas fa-fast-forward"></i>
          </button>

          <!-- 🔥 优化：音量控制 -->
          <div class="volume-control-wrapper" style="position: relative; display: flex; align-items: center;">
            <button id="volumeIcon" class="volume-btn" title="音量控制">
              <i class="fas fa-volume-down"></i>
            </button>
            <div id="volumePopup" class="volume-popup">
              <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 5px;">
                <input type="range" id="volumeSlider" min="0" max="100" value="50" style="
                      flex: 1;
                      cursor: pointer;
                      accent-color: #3498db;
                    " />
                <span id="volumeValue" style="
                      font-size: 12px;
                      color: #666;
                      min-width: 35px;
                    ">50%</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 🔥 胜率曲线图 -->
        <div class="chart-section">
          <div style="
                font-size: 14px;
                font-weight: bold;
                margin-bottom: 10px;
                color: #2c3e50;
                display: flex;
                justify-content: space-between;
              ">
            <span><i class="fas fa-chart-line"></i> 胜率走势图 (黑棋视角)</span>
            <span id="chartMoveIndicator" style="color: #3498db; font-family: monospace">#0</span>
          </div>
          <canvas id="winrateChart"></canvas>
        </div>
      </div>
    </div>

    <!-- 右侧：编辑面板 -->
    <div class="editor-section">
      <div style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px">
        <button id="analyzeCandidatesBtn" class="control-btn btn-verify" style="width: 100%;">
          <i class="fas fa-microchip"></i> AI 验证 (全盘深度搜索)
        </button>
        <div style="display: flex; gap: 10px">
          <button id="quickSaveProblemBtn" class="control-btn btn-primary" style="flex: 1;">
            <i class="fas fa-bolt"></i> 快速保存
          </button>
          <button id="saveProblemBtn" class="control-btn btn-success" style="flex: 1;">
            <i class="fas fa-save"></i> 完整保存
          </button>
        </div>
      </div>

      <!-- 待验证题目列表 -->
      <div id="pendingQuestionsPanel" style="display: none; margin-bottom: 15px">
        <h3 class="panel-title" style="display: flex; justify-content: space-between; align-items: center">
          <span><i class="fas fa-clock"></i> 待验证题目</span>
          <span id="pendingCount" style="
                background: #e74c3c;
                color: white;
                padding: 2px 8px;
                border-radius: 10px;
                font-size: 11px;
              ">0</span>
        </h3>
        <ul class="loss-list" id="pendingQuestionsList" style="max-height: 200px; margin-bottom: 10px">
        </ul>
        <button id="batchVerifyBtn" class="control-btn btn-warning" style="width: 100%;">
          <i class="fas fa-tasks"></i> 立即批量验证
        </button>
        <div id="batchProgressBar" style="display: none; margin-top: 8px">
          <div style="background: #ecf0f1; border-radius: 4px; overflow: hidden; height: 8px">
            <div id="batchProgressFill" style="
                  width: 0%;
                  height: 100%;
                  background-color: var(--success-color);
                  transition: width 0.3s;
                "></div>
          </div>
          <div id="batchProgressText" style="font-size: 11px; color: #666; text-align: center; margin-top: 4px">
            0/0
          </div>
        </div>
      </div>

      <h3 class="panel-title">
        <i class="fas fa-list-ul"></i>
        候选点管理
      </h3>

      <div class="mode-toggle">
        <button class="mode-btn active" id="modeView">浏览模式</button>

  <!-- 复用 SGFAnalysis.html 中的棋盘初始化代码 -->
  <script>
    // 简化的棋盘初始化逻辑
    const maxWinSize = 3000;
    const minWinSize = 300;

    function calculateBoardSize() {
      // 获取中间内容区域的宽度，而不是整个窗口宽度
      const container = document.querySelector(".board-container");
      const winWidth = container
        ? container.clientWidth
        : window.innerWidth * 0.6;
      const winHeight = window.innerHeight;

      let cellSizeFromWidth = Math.floor((winWidth - 20) / 20);
      // 🔥 为了让图表和棋盘能同屏，预留更多垂直空间给图表和导航栏 (从 100 增加到 250)
      let cellSizeFromHeight = Math.floor((winHeight - 250) / 20);

      let cellSize = Math.min(cellSizeFromWidth, cellSizeFromHeight) * 0.8;

      // 限制最小/最大值
      cellSize = Math.max(20, Math.min(cellSize, 60));

      const boardSize = 19;
      const stoneSize = Math.floor(cellSize * 0.95);
      let maxFrameWidth = cellSize * (boardSize + 3);
      return { cellSize, stoneSize, maxFrameWidth };
    }

    function updateStoneSizeCSS(cellSize) {
      document.documentElement.style.setProperty(
        "--stone-size",
        `${cellSize}px`,
      );
      document.documentElement.style.setProperty(
        "--cell-size",
        `${cellSize}px`,
      );
      document.documentElement.style.setProperty(
        "--font-size",
        `${cellSize * 0.4}px`,
      );
    }

    // Must define this here as copy-pasted inline script in SGFAnalysis.html
    (function () {
      const __createBoard3Fallback = function (options) {
        let {
          domElement,
          boardSize = 19,
          cellSize,
          lineColor = "#000",
          backgroundColor = "#DEB887",
        } = options;

        const marginOffset =
          options && typeof options.marginOffset === "number"
            ? options.marginOffset
            : cellSize;

        console.log(`Creating board: Size=${boardSize}, Cell=${cellSize}`);
        domElement.innerHTML = "";
        const boardPhysicalSize =
          (boardSize - 1) * cellSize + 2 * marginOffset;
        domElement.style.width = `${boardPhysicalSize}px`;
        domElement.style.height = `${boardPhysicalSize}px`;
        domElement.style.position = "relative";
        domElement.style.backgroundColor = backgroundColor;
        domElement.style.margin = "0 auto"; // Center it
        domElement.style.boxShadow = "0 5px 15px rgba(0,0,0,0.3)";

        for (let i = 0; i < boardSize; i++) {
          const vertical = document.createElement("div");
          vertical.style.position = "absolute";
          vertical.style.left = `${marginOffset + i * cellSize}px`;
          vertical.style.top = `${marginOffset}px`;
          vertical.style.width = "1px";
          vertical.style.height = `${(boardSize - 1) * cellSize}px`;
          vertical.style.backgroundColor = lineColor;
          vertical.style.zIndex = "1";
          domElement.appendChild(vertical);

          const horizontal = document.createElement("div");
          horizontal.style.position = "absolute";
          horizontal.style.left = `${marginOffset}px`;
          horizontal.style.top = `${marginOffset + i * cellSize}px`;
          horizontal.style.width = `${(boardSize - 1) * cellSize}px`;
          horizontal.style.height = "1px";
          horizontal.style.backgroundColor = lineColor;
          horizontal.style.zIndex = "1";
          domElement.appendChild(horizontal);
        }

        for (let i = 0; i < boardSize; i++) {
          for (let j = 0; j < boardSize; j++) {
            const intersection = document.createElement("div");
            intersection.className = "intersection";
            intersection.dataset.row = i;
            intersection.dataset.col = j;
            intersection.style.position = "absolute";
            intersection.style.left = `${marginOffset + j * cellSize - cellSize / 2}px`;
            intersection.style.top = `${marginOffset + i * cellSize - cellSize / 2}px`;
            intersection.style.width = `${cellSize}px`;
            intersection.style.height = `${cellSize}px`;
            intersection.style.zIndex = "2";
            domElement.appendChild(intersection);
          }
        }

        const starPoints = [
          [3, 3],
          [3, 9],
          [3, 15],
          [9, 3],
          [9, 9],
          [9, 15],
          [15, 3],
          [15, 9],
          [15, 15],
        ];
        starPoints.forEach(([row, col]) => {
          const intersection = domElement.querySelector(
            `[data-row="${row}"][data-col="${col}"]`,
          );
          if (intersection) {
            const starPoint = document.createElement("div");
            starPoint.style.position = "absolute";
            starPoint.style.top = "50%";
            starPoint.style.left = "50%";
            starPoint.style.transform = "translate(-50%, -50%)";
            starPoint.style.width = `${cellSize * 0.2}px`;
            starPoint.style.height = `${cellSize * 0.2}px`;
            starPoint.style.backgroundColor = lineColor;
            starPoint.style.borderRadius = "50%";
            starPoint.style.zIndex = "3";
            intersection.appendChild(starPoint);
          }
        });

        if (typeof window.addBoardLabels === "function") {
          window.addBoardLabels(domElement, boardSize, cellSize, {
            offset: marginOffset,
            inset: Math.max(2, marginOffset * 0.2),
          });
        }
      };

      const __fromGoBoard = window.createBoard3;
      window.createBoard3 = function (options) {
        if (typeof __fromGoBoard === "function") {
          return __fromGoBoard(options);
        }
        return __createBoard3Fallback(options);
      };
    })();
  </script>
